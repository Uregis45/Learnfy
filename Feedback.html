<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnfy - Feedback</title>
  <style>
    /* Same base styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; color: #333; line-height: 1.6; }
    header {
      background-color: #0f39ac; color: white; display: flex; justify-content: space-between;
      align-items: center; padding: 15px 30px; position: sticky; top: 0; z-index: 100;
    }
    header img { width: 80px; height: 80px; }
    nav ul { list-style: none; display: flex; gap: 20px; }
    nav ul li a { color: white; text-decoration: none; font-weight: bold; transition: 0.3s; }
    nav ul li a:hover { color: #ffd700; }
    main { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #0f245f; text-align: center; margin-bottom: 20px; }
    .form-container {
      background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    fieldset {
      border: 2px solid #0f39ac; border-radius: 8px; padding: 20px; margin-bottom: 20px;
    }
    legend {
      font-weight: bold; color: #0f39ac; padding: 0 10px; background: white;
    }
    label { display: block; margin: 15px 0 5px; font-weight: bold; }
    input, textarea, select {
      width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1rem;
    }
    input:focus, textarea:focus { border-color: #0f39ac; outline: none; }
    button {
      background: #0f39ac; color: white; border: none; padding: 12px 25px; border-radius: 5px;
      font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
    }
    button:hover { background: #0c2c8a; }
    footer {
      background-color: #0f245f; color: white; text-align: center; padding: 20px; margin-top: 60px;
    }
  </style>
</head>
<body>
  <header>
    <div><img src="logo.png" alt="Learnfy Logo"></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="subject.html">Subjects</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>📮 We Value Your Feedback</h1>
    <div class="form-container">
      <form action="#" method="post">
        <fieldset>
          <legend>Personal Information</legend>
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" placeholder="e.g., John Doe" required>
          
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </fieldset>

        <fieldset>
          <legend>Your Feedback</legend>
          <label for="rating">How would you rate our content?</label>
          <select id="rating" name="rating">
            <option value="5">Excellent</option>
            <option value="4">Good</option>
            <option value="3">Average</option>
            <option value="2">Fair</option>
            <option value="1">Poor</option>
          </select>
          
          <label for="message">Comments / Suggestions:</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell us what you think..."></textarea>
        </fieldset>

        <fieldset>
          <legend>What tags did you like?</legend>
          <label><input type="checkbox" name="tags" value="dl"> Description List (&lt;dl&gt;)</label>
          <label><input type="checkbox" name="tags" value="form"> Form Tags</label>
          <label><input type="checkbox" name="tags" value="media"> Media Tags</label>
        </fieldset>

        <button type="submit">Submit Feedback</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Learnfy. Thanks for your feedback!</p>
  </footer>
</body>
</html>
