   <h2>Send Feedback</h2>
    <form id="feedbackForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter Your Name">
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"placeholder="Your E-mail" required>
        </div>
        
        <div class="form-group">
            <label for="message">Feedback:</label>
            <textarea id="message" name="message" placeholder="Feedback or any challenge" required></textarea>
        </div>
        
        <button type="submit">Send Feedback</button>
    </form>
    
    <div id="responseMessage" class="message"></div>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };
            
            try {
                const response = await fetch('http://localhost:3000/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                const messageDiv = document.getElementById('responseMessage');
                if (response.ok) {
                    messageDiv.textContent = '✅ Thank you for your feedback!';
                    messageDiv.className = 'message success';
                    document.getElementById('feedbackForm').reset();
                } else {
                    messageDiv.textContent = '❌ ' + (result.error || 'Something went wrong');
                    messageDiv.className = 'message error';
                }
                messageDiv.style.display = 'block';
                
            } catch (error) {
                document.getElementById('responseMessage').textContent = '❌ Network error';
                document.getElementById('responseMessage').className = 'message error';
                document.getElementById('responseMessage').style.display = 'block';
            }
        });
    </script>
